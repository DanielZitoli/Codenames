[project]
name = "codenames-server"
version = "0.1.0"
description = "Authoritative real-time game server: rooms, players, turns, websockets"
requires-python = ">=3.11"
dependencies = [
    "codenames-core",
    "codemaster",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
codenames-core = { workspace = true }
codemaster = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
