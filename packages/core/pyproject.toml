[project]
name = "codenames-core"
version = "0.1.0"
description = "Single source of truth for Codenames rules, board state, and role-specific views"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codenames_core"]
