[project]
name = "codemaster"
version = "0.1.0"
description = "AI codemaster/guesser agents built on word-sense embeddings"
requires-python = ">=3.11"
dependencies = [
    "codenames-core",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Offline/heavy: only needed to run packages/codemaster/pipeline (WSI, artifact export).
# The server and online engine/agents/eval install the base package only — see
# CLAUDE.md boundary #2 and this package's CLAUDE.md "dependency boundary" test.
pipeline = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "wordfreq>=3.1",
    "lemminflect>=0.2",
    "spacy>=3.7",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
codenames-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codemaster"]
